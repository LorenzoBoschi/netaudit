[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netaudit"
dynamic = ["version"]
description = "Identification-only security audit of a local network, with a self-contained HTML report"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
netaudit = "netaudit.cli:main"

[tool.setuptools]
packages = ["netaudit"]

[tool.setuptools.dynamic]
version = { attr = "netaudit.__version__" }
